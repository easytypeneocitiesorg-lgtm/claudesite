  const fs=h("button",{onclick:()=>{document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen?stage.requestFullscreen().catch(()=>{}):0}},"⛶ Fullscreen");

  return h("div",{},h("div",{class:"bar",style:"margin-bottom:12px"},h("button",{onclick:()=>history.length>1?history.back():go("all")},"← Back"),h("h1",{style:"font-size:26px;margin:0 8px"},g.title),fav,h("button",{onclick:reload},"↻ Reload"),fs),stage,
    h("p",{},g.description),h("p",{style:"color:var(--t2)"},"Source: "+g.source+" · ",h("a",{class:"ext",href:g.url,target:"_blank",rel:"noopener noreferrer"},"open original ↗"),h("br"),"Embedding status: "+g.embeddingStatus),
    rel.length?h("div",{},h("h2",{},"Related games"),grid(rel)):null);
}

function views(route){
  const [r,arg]=route.split("/");
  if(r==="play")return player(arg);
  if(r==="all")return library(G,"All Games");
  if(r==="featured")return h("div",{},h("h1",{style:"font-size:32px"},"Featured"),h("p",{style:"color:var(--t2)"},"Hand-picked from the library."),grid(FEAT));
  if(r==="recent"){const l=st.recent.map(x=>G.find(g=>g.id===x.id)).filter(Boolean);return l.length?library(l,"Recently Played"):h("div",{},h("h1",{style:"font-size:32px"},"Recently Played"),empty("Nothing played yet."))}
  if(r==="favs"){const l=G.filter(g=>st.favs.includes(g.id));return l.length?library(l,"Favorites"):h("div",{},h("h1",{style:"font-size:32px"},"Favorites"),empty("No favorites yet. Open a game and tap ☆."))}
  if(r==="categories")return h("div",{},h("h1",{style:"font-size:32px"},"Categories"),h("div",{class:"grid"},cats().map(c=>h("button",{class:"card",onclick:()=>{cat=c;go("all")}},h("div",{class:"cb"},h("b",{},c),h("small",{},G.filter(g=>g.category===c).length+" games"))))));
  if(r==="settings")return settings();
  if(r==="about")return h("div",{},h("h1",{style:"font-size:32px"},"About"),h("p",{},"Umbra Arcade is a portal. It doesn't host or make any games: each one loads from its original host inside a sandboxed iframe."),h("p",{},"The first 25 games are open-source browser games from the leereilly/games directory on GitHub; the rest load from a third-party mirror that this site does not control. None have been tested in this site's iframe, so some may refuse to load; if one fails, use the link to open it on its own site."),h("p",{style:"color:var(--t2)"},"No accounts, tracking or backend. Favorites, history and settings stay in your browser."));
  return home();
}
function home(){
  return h("section",{class:"splash"},
    (()=>{const d=h("div",{"aria-hidden":"true"});d.innerHTML='<svg width="130" height="130" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#5B21B6"/><path d="M22 6a11 11 0 1 0 0 20 9 9 0 0 1 0-20z" fill="#08060D"/><circle cx="16" cy="16" r="14" fill="none" stroke="#A78BFA" stroke-width="1.2"/></svg>';return d})(),
    h("h1",{},"UMBRA ARCADE"),
    h("p",{},"Open the menu to find your game."),
    h("button",{class:"pri",onclick:openNav},"☰ Open menu"));
}
function settings(){
  const row=(l,d,c)=>h("div",{class:"set"},h("div",{},h("b",{},l),h("div",{style:"color:var(--t2)"},d)),c);
  return h("div",{},h("h1",{style:"font-size:32px"},"Settings"),
    row("Background animation","Particles that follow your pointer.",h("input",{type:"checkbox","aria-label":"Background animation",checked:st.anim?"":null,onchange:e=>{st.anim=e.target.checked;save();bgSet()}})),
    row("Grid density","Cards per row on large screens.",h("select",{"aria-label":"Grid density",onchange:e=>{st.cols=+e.target.value;save();applyCols()}},[3,4,5].map(n=>{const o=h("option",{value:n},n);if(st.cols===n)o.selected=true;return o}))),
    row("Clear favorites","Remove all saved favorites.",h("button",{onclick:()=>{if(confirm("Clear all favorites?")){st.favs=[];save();render()}}},"Clear")),
    row("Clear history","Remove recently played.",h("button",{onclick:()=>{if(confirm("Clear recently played history?")){st.recent=[];save();render()}}},"Clear")),
    row("Reset everything","Favorites, history and preferences.",h("button",{onclick:()=>{if(confirm("Reset all saved data?")){st=JSON.parse(JSON.stringify(DEF));save();applyCols();bgSet();render()}}},"Reset")));
}

// ---- shell ----
function renderNav(route){
  const base=route.split("/")[0]||"home",nav=$("#nav");
  nav.replaceChildren(h("div",{class:"logo",style:"margin:0 0 14px 6px"},"UMBRA ARCADE"),...NAV.map(n=>h("a",{href:"#"+n[0],class:(base===n[0]||(base==="play"&&n[0]==="all"))?"act":"","aria-current":base===n[0]?"page":null},n[1])));
}
function render(){
  const route=location.hash.slice(1)||"home";
  renderNav(route);closeNav();
  document.body.classList.toggle("home",route==="home");const v=$("#view");v.replaceChildren(views(route));
  document.title=(route.startsWith("play/")?(G.find(g=>g.id===route.slice(5))||{title:"Game"}).title+" · ":"")+"Umbra Arcade";
}
function openNav(){$("#nav").classList.add("open");$("#scrim").classList.add("on");$("#menu").setAttribute("aria-expanded","true");$("#nav a").focus()}
function closeNav(){$("#nav").classList.remove("open");$("#scrim").classList.remove("on");$("#menu").setAttribute("aria-expanded","false")}
const applyCols=()=>document.documentElement.style.setProperty("--cols",st.cols);
$("#menu").onclick=()=>$("#nav").classList.contains("open")?closeNav():openNav();
$("#scrim").onclick=closeNav;$("#home").onclick=()=>go("home");
$("#home").onkeydown=e=>{if(e.key==="Enter")go("home")};
addEventListener("hashchange",render);
const q=$("#q"),qx=$("#qx"),sug=$("#sug");
function sugs(){
  const t=q.value.trim().toLowerCase();
  const l=(t?G.filter(g=>g.title.toLowerCase().includes(t)):G.slice(0,5)).slice(0,5);
  sug.replaceChildren(...l.map(g=>h("button",{onmousedown:e=>{e.preventDefault();q.value="";query="";qx.hidden=true;sug.style.display="none";go("play/"+g.id)}},g.title)));
  sug.style.display=l.length?"block":"none";
}
q.addEventListener("input",()=>{query=q.value;qx.hidden=!q.value.trim();sugs();if(!/^(all|recent|favs)/.test(location.hash.slice(1)))go("all");else render()});
q.addEventListener("focus",sugs);q.addEventListener("blur",()=>sug.style.display="none");
q.addEventListener("keydown",e=>{if(e.key==="Enter"){sug.style.display="none";go("all");render()}});
qx.onclick=()=>{q.value="";query="";qx.hidden=true;render();q.focus()};
addEventListener("keydown",e=>{
  if(e.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();q.focus()}
  if(e.key==="Escape")closeNav();
});

// ---- background: pointer-reactive particles ----
const cv=$("#bg"),cx=cv.getContext("2d");let W,H,P=[],raf=0,mx=-999,my=-999;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(70,Math.floor(W*H/22000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.6+.4}))}
function frame(){
  cx.clearRect(0,0,W,H);
  for(const p of P){
    const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);
    if(d<120){p.vx+=dx/d*.04;p.vy+=dy/d*.04}
    p.vx*=.99;p.vy*=.99;p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;
    cx.fillStyle="rgba(167,139,250,.55)";cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.3);cx.fill();
  }
  raf=requestAnimationFrame(frame);
}
function bgSet(){
  cancelAnimationFrame(raf);cx.clearRect(0,0,W||0,H||0);
  if(st.anim&&!reduced.matches&&!document.hidden){size();raf=requestAnimationFrame(frame)}
}
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY});
addEventListener("pointerleave",()=>{mx=my=-999});
addEventListener("resize",()=>{if(st.anim&&!reduced.matches)size()});
document.addEventListener("visibilitychange",bgSet);reduced.addEventListener("change",bgSet);

applyCols();bgSet();render();
</script></body></html>
